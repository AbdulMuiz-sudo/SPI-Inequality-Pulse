name: Weekly SPI & WFP Data Fetch

on:
  schedule:
    - cron: '0 12 * * 5' # Runs every Friday at 12:00 UTC
  workflow_dispatch: # Allows manual trigger button in GitHub Actions tab

# Required so GitHub Actions is allowed to push commits back to your repo
permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run Fetch Scripts
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python src/fetch_pbs.py
          python src/fetch_wfp.py

      - name: Commit and Push New PBS Data (If Any)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/raw/
          
          # Only commit and push if there are actual file changes
          if ! git diff --cached --quiet; then
            git commit -m "Automated data fetch: new PBS files"
            git push
          else
            echo "No new files to commit."
          fi