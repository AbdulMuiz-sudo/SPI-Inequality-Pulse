name: Weekly SPI & WFP Data Fetch

on:
  schedule:
    - cron: '0 12 * * 5' # Runs every Friday at 12:00 UTC
  workflow_dispatch: # Allows manual trigger button in GitHub

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Fetch Scripts
        run: |
          python src/fetch_pbs.py
          python src/fetch_wfp.py
          
      - name: Commit New Data (If Any)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/raw/
          git commit -m "Automated data fetch" || echo "No new data to commit"
          git push